# Capability matrix: the minimum client version that supports a feature.
#
# Per feature, per platform:
#   "<version>"  supported since that version
#   never        not supported on this platform
#   (absent)     no known restriction
#
# `verified: false` marks entries that were not confirmed against official docs;
# fix them here when you know better. Renderers consult these keys to
# downgrade (e.g. smart -> url-test) or drop unsupported nodes / params.
#
# Sources: manual.nssurge.com (policies/*, policy-groups/*, rules/ruleset),
#          stash.wiki (proxy-types, rules/rule-set, release-notes/ios),
# `latest` values were checked on 2026-11-22 against: the App Store (Surge iOS,
# Stash, Loon, Quantumult X), the official Sparkle update feeds (Surge Mac:
# sgupd.com; Stash macOS: releases.stash.ws, stable channel) and GitHub releases
# (mihomo, FlClash, sing-box). Re-check them there when updating.
#
#          wiki.metacubex.one (mihomo), sing-box.sagernet.org (configuration, changelog),
#          nsloon.app/docs, Quantumult X sample configs (crossutility/Quantumult-X).
#
# The entries for Clash Meta / FlClash / sing-box / Loon / Quantumult X were written
# from memory of those docs; anything not confirmed carries `verified: false`.

clients:
  surge:
    label: Surge
    order: 1
    ext: .conf
    import: "surge:///install-config?url={url}"
    platforms:
      ios: {label: "Surge iOS", latest: "6.0.1", order: 1}
      mac: {label: "Surge Mac", latest: "6.12.0", order: 2}
    features:
      proxy.ss: {}
      proxy.ssr: {ios: never, mac: never}
      proxy.vmess: {}
      proxy.vless: {ios: "6.0.0", mac: "6.12.0"}
      proxy.trojan: {}
      proxy.hysteria: {ios: never, mac: never}
      proxy.hysteria2: {ios: "5.8.0", mac: "5.4.0"}
      proxy.tuic: {}
      proxy.tuic-v5: {verified: false}
      proxy.wireguard: {}
      proxy.snell: {}
      proxy.anytls: {ios: "5.17.0", mac: "6.4.3"}
      proxy.http: {}
      proxy.socks5: {}

      transport.ws: {}
      transport.httpupgrade: {ios: "6.0.0", mac: "6.12.0"}
      transport.grpc: {ios: "6.0.0", mac: "6.12.0"}   # VLESS only
      transport.xhttp: {ios: "6.0.0", mac: "6.12.0"}  # VLESS only
      transport.h2: {ios: never, mac: never}
      transport.http: {ios: never, mac: never}

      tls.alpn: {ios: "5.20.0", mac: "6.7.0"}
      tls.client-fingerprint: {ios: "6.1.0", mac: "6.13.0"}
      tls.reality: {ios: "6.0.0", mac: "6.12.0"}      # VLESS only
      vless.encryption: {ios: "6.0.0", mac: "6.12.0"}

      ss.obfs: {}
      ss.v2ray-plugin: {ios: never, mac: never}
      shadow-tls.v2: {ios: "5.2.0", mac: "4.10.0"}
      shadow-tls.v3: {ios: "5.5.0", mac: "5.0.3"}
      hysteria2.port-hopping: {}
      hysteria2.salamander: {mac: "6.4.3", verified: false}
      hysteria2.gecko: {ios: "5.20.0", mac: "6.7.0"}

      group.select: {}
      group.url-test: {}
      group.fallback: {}
      group.load-balance: {}
      group.smart: {ios: "5.11.0", mac: "5.7.0"}
      group.icon: {mac: "6.5.0"}
      group.category: {ios: "5.23.0", mac: "6.10.0"}
      group.include-other-group: {ios: "4.12.0", mac: "4.5.0"}

      rule.rule-set: {}
      rule.domain-set: {}
      # RULE-SET:url / DOMAIN-SET:url as [Host] keys (manual: dns/local-dns-mapping).
      host.rule-set: {mac: "5.10.0", ios: "5.0.0", verified: false}

  stash:
    label: Stash
    order: 2
    ext: .yaml
    import: "stash://install-config?url={url}"
    # Stash version numbers are app versions. Before 5.0 iOS/tvOS used 3.x and macOS 4.x; since 5.0 both share one number.
    platforms:
      ios: {label: "Stash iOS/tvOS", latest: "5.0.0", order: 1}
      mac: {label: "Stash macOS", latest: "5.0.0", order: 2}
    features:
      proxy.ss: {}
      proxy.ssr: {}
      proxy.vmess: {}
      proxy.vless: {ios: "3.1.0", verified: false}
      proxy.trojan: {}
      proxy.hysteria: {}
      proxy.hysteria2: {}
      proxy.tuic: {}
      proxy.tuic-v5: {}
      proxy.wireguard: {}
      proxy.snell: {}
      proxy.anytls: {ios: "3.3.0", verified: false}
      proxy.http: {}
      proxy.socks5: {}

      transport.ws: {}
      transport.httpupgrade: {verified: false}
      transport.grpc: {}
      transport.h2: {}
      transport.http: {}
      transport.xhttp: {ios: "3.6.0", mac: "4.3.0"}

      tls.alpn: {}
      tls.client-fingerprint: {}
      tls.reality: {ios: "3.1.0", verified: false}      # VLESS; VMess/Trojan REALITY: 3.6/4.3
      tls.reality-non-vless: {ios: "3.6.0", mac: "4.3.0"}
      vless.encryption: {ios: "3.6.0", mac: "4.3.0"}

      ss.obfs: {}
      ss.v2ray-plugin: {}
      shadow-tls.v2: {ios: "3.0.0"}
      shadow-tls.v3: {ios: "3.0.0"}
      hysteria2.port-hopping: {}
      hysteria2.salamander: {ios: "3.4.0", mac: "4.2.0"}
      hysteria2.gecko: {ios: "3.6.0", mac: "4.3.0"}

      group.select: {}
      group.url-test: {}
      group.fallback: {}
      group.load-balance: {}
      group.smart: {ios: never, mac: never}
      group.icon: {}
      group.category: {ios: never, mac: never}
      group.include-other-group: {}

      rule.rule-set: {}
      rule.domain-set: {}

  clash-meta:
    label: Clash Meta (mihomo)
    order: 3
    ext: .yaml
    import: "clash://install-config?url={url}&name={name}"
    # Versions are mihomo core versions (Clash Verge Rev, Clash Meta for Android, …).
    platforms:
      core: {label: "mihomo 内核", latest: "1.19.34", order: 1}
    features:
      proxy.anytls: {core: "1.19.3", verified: false}
      transport.xhttp: {core: "1.19.14", verified: false}
      vless.encryption: {core: "1.19.13", verified: false}
      tls.reality-non-vless: {core: never, verified: false}
      hysteria2.gecko: {core: never, verified: false}
      group.smart: {core: never}
      group.category: {core: never}

  flclash:
    label: FlClash
    order: 4
    ext: .yaml
    import: "clash://install-config?url={url}&name={name}"
    # FlClash bundles a recent mihomo core; app versions are not mapped to core features.
    platforms:
      all: {label: "FlClash", latest: "0.9.4", order: 1}
    features:
      tls.reality-non-vless: {all: never, verified: false}
      hysteria2.gecko: {all: never, verified: false}
      group.smart: {all: never}
      group.category: {all: never}

  sing-box:
    label: sing-box
    order: 5
    ext: .json
    import: "sing-box://import-remote-profile?url={url}#{name}"
    # The renderer writes the 1.11+ format (rule actions, WireGuard endpoints);
    # from 1.12 it also uses the new DNS server format.
    platforms:
      all: {label: "sing-box", latest: "1.14.4", order: 1}
    features:
      min: {all: "1.11.0"}
      dns.typed-servers: {all: "1.12.0"}
      proxy.ssr: {all: never}
      proxy.snell: {all: never}
      proxy.anytls: {all: "1.12.0"}
      transport.xhttp: {all: never}
      vless.encryption: {all: never}
      hysteria2.gecko: {all: never}
      ss.v2ray-plugin: {}
      shadow-tls.v2: {}
      shadow-tls.v3: {}
      group.fallback: {all: never}
      group.load-balance: {all: never}
      group.smart: {all: never}
      group.icon: {all: never}
      group.category: {all: never}

  loon:
    label: Loon
    order: 6
    ext: .conf
    platforms:
      ios: {label: "Loon", latest: "3.5.3", order: 1}
    features:
      proxy.vless: {verified: false}
      proxy.hysteria: {ios: never}
      proxy.hysteria2: {ios: "3.1.0", verified: false}
      proxy.tuic: {ios: never, verified: false}
      proxy.tuic-v5: {ios: never, verified: false}
      proxy.snell: {ios: never, verified: false}
      proxy.anytls: {ios: "3.3.0", verified: false}
      transport.httpupgrade: {ios: never, verified: false}
      transport.grpc: {ios: never, verified: false}
      transport.h2: {ios: never, verified: false}
      transport.xhttp: {ios: never}
      tls.client-fingerprint: {ios: never, verified: false}
      tls.reality: {ios: "3.2.1", verified: false}
      tls.reality-non-vless: {ios: never}
      vless.encryption: {ios: never}
      ss.v2ray-plugin: {ios: never, verified: false}
      shadow-tls.v2: {ios: never, verified: false}
      shadow-tls.v3: {ios: never, verified: false}
      hysteria2.gecko: {ios: never}
      group.smart: {ios: never}
      group.category: {ios: never}
      rule.protocol: {ios: "3.1.7"}
      rule.logical: {verified: false}   # AND / OR / NOT; rule sets cannot be used inside them

  qx:
    label: Quantumult X
    order: 7
    ext: .conf
    platforms:
      ios: {label: "Quantumult X", latest: "1.8.1", order: 1}
    features:
      proxy.vless: {ios: "1.5.0", verified: false}
      proxy.hysteria: {ios: never}
      proxy.hysteria2: {ios: never, verified: false}
      proxy.tuic: {ios: never}
      proxy.tuic-v5: {ios: never}
      proxy.wireguard: {ios: never}
      proxy.snell: {ios: never}
      proxy.anytls: {ios: never}
      transport.httpupgrade: {ios: never}
      transport.grpc: {ios: never}
      transport.h2: {ios: never}
      transport.http: {ios: never}
      transport.xhttp: {ios: never}
      tls.alpn: {ios: never, verified: false}
      tls.client-fingerprint: {ios: never}
      tls.reality: {ios: "1.5.0", verified: false}
      tls.reality-non-vless: {ios: never}
      vless.encryption: {ios: never}
      shadow-tls.v2: {ios: never}
      shadow-tls.v3: {ios: never}
      group.smart: {ios: never}
      group.category: {ios: never}
      group.include-other-group: {}
      rule.protocol: {ios: never}
      rule.logical: {ios: never}
