[General]
loglevel = notify

[Proxy]
DIRECT-x = direct
HK SS = ss, hk.example.com, 8388, encrypt-method=aes-256-gcm, password=pw, obfs=http, obfs-host=bing.com, udp-relay=true
JP VMess = vmess, jp.example.com, 443, username=b831b1f8-5a5e-4b57-a03e-1234567890ab, ws=true, ws-path=/ws, ws-headers=Host:"jp.example.com", tls=true, sni=jp.example.com, vmess-aead=true
US Reality = vless, us.example.com, 443, username=uuid-1, flow=xtls-rprx-vision, sni=www.microsoft.com, reality-public-key=PK, reality-short-id=01ab
HY2 = hysteria2, hy.example.com, 443, password=p, download-bandwidth=100, port-hopping="20000-30000;40000"
Office = wireguard, section-name=office

[WireGuard office]
private-key = priv
self-ip = 10.20.0.2
peer = (public-key = pub, allowed-ips = "0.0.0.0/0, ::/0", endpoint = wg.example.com:51820, keepalive = 25, client-id = 1/2/3)
